spring.application.name=workmate-backend

server.port=8080

# Anthropic configuration
anthropic.base-url=https://api.anthropic.com
anthropic.api-key=${ANTHROPIC_API_KEY}
anthropic.model=${ANTHROPIC_MODEL}

# Logging
logging.level.com.workmate.backend=INFO

# Actuator
management.endpoints.web.exposure.include=health,info

# Phase 1 evaluation rate limiting
evaluation.delay-ms=1500

# Server-controlled employee identity for local development
workmate.demo-employee-id=EMP001

# -----------------------------------------------
# Database Configuration
# -----------------------------------------------

spring.datasource.url=jdbc:h2:file:./data/workmate
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# -----------------------------------------------
# JPA / Hibernate Configuration
# -----------------------------------------------

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------------------------
# H2 Console
# -----------------------------------------------

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# WorkMate Context Management
# ==========================================

# Maximum estimated token budget for conversation history
workmate.context.max-history-tokens=12000

# Maximum number of recent messages to retain
workmate.context.max-history-messages=30

# Reserve tokens for system instructions and Claude response
workmate.context.reserved-tokens=3000

# Conversation summarization
workmate.context.summarize-after-messages=5
workmate.context.preserve-recent-messages=4
workmate.context.summary-max-tokens=1000